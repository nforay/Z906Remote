name: PlatformIO CI

on:
  push:
    branches:
      - master
      - develop
    paths:
      - "back/include/**"
      - "back/lib/**"
      - "back/src/**"
      - "platformio.ini"
      - ".github/workflows/pio.yml"
  pull_request:
    branches:
      - master
      - develop
    paths:
      - "back/include/**"
      - "back/lib/**"
      - "back/src/**"
      - "platformio.ini"
      - ".github/workflows/pio.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Edit .env
        run: sed -i 's/INCLUDE_MQTT=0/INCLUDE_MQTT=1/g' .env

      - name: Build PlatformIO Project
        run: pio run
